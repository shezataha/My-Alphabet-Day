<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>My Alphabet Day — Alphabet Fun for Little Learners</title>
  <meta name="description" content="A colorful alphabet game for 3-year-olds, built around everyday essentials like milk, toothbrush and soap.">
  <meta name="theme-color" content="#aee9ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Alphabet Day">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="bg" aria-hidden="true"></div>

  <header id="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
    <button id="backBtn" class="icon-btn hidden" aria-label="Go back">←</button>
    <h1 id="title">My Alphabet Day</h1>
    <button id="parentBtn" class="icon-btn" aria-label="Grown-up settings, press and hold">⚙️</button>
  </header>

  <div id="sidebarOverlay" class="sidebar-overlay hidden"></div>
  <aside id="sidebar" class="sidebar hidden">
    <div class="sidebar-header">
      <span class="sidebar-avatar" id="sidebarAvatar">👤</span>
      <div class="sidebar-user">
        <span class="sidebar-name" id="sidebarName">Guest</span>
        <span class="sidebar-status" id="sidebarStatus">Not logged in</span>
      </div>
      <button id="sidebarClose" class="sidebar-close" aria-label="Close menu">✕</button>
    </div>
    <nav class="sidebar-nav">
      <button class="sidebar-link" data-go="home">🏠 Home</button>
      <button class="sidebar-link" data-go="profile">👤 Profile</button>
      <button class="sidebar-link" data-go="fruits">🍎 Fruits</button>
      <button class="sidebar-link" data-go="vegetables">🥕 Vegetables</button>
      <button class="sidebar-link" data-go="colors">🎨 Colors</button>
      <button class="sidebar-link" data-go="poems">📝 Poems</button>
      <button class="sidebar-link" data-go="stickers">⭐ Stickers</button>
    </nav>
    <div class="sidebar-actions">
      <button id="sidebarLogin" class="sidebar-btn">🔑 Login / Switch Player</button>
      <button id="sidebarLogout" class="sidebar-btn hidden">🚪 Logout</button>
      <button id="sidebarSpeech" class="sidebar-btn">🔊 Speech: On</button>
      <button id="sidebarReset" class="sidebar-btn warn">🧹 Reset Progress</button>
    </div>
  </aside>

  <main id="screen"></main>

  <div id="fx" aria-hidden="true"></div>

  <div id="parentModal" class="modal hidden">
    <div class="modal-box">
      <h2>👨‍👩‍👧 Grown-ups only</h2>
      <p class="modal-note">Press and hold the ⚙️ button for 3 seconds to reopen this menu.</p>
      <button id="speechToggle" class="p-btn">🔊 Speech: On</button>
      <button id="switchBtn" class="p-btn hidden">🔄 Switch player</button>
      <button id="resetBtn" class="p-btn warn">🧹 Reset all progress</button>
      <button id="closeParent" class="p-btn plain">Close</button>
    </div>
  </div>

  <noscript>
    <p style="text-align:center;font-size:20px;padding:40px">Please enable JavaScript to play.</p>
  </noscript>

  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
